spring.application.name=service-backend
server.port=8080

# --- MongoDB Atlas Configuration (Loaded dynamically from .env or System Environment) ---
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:crime_solver_db}

# --- JWT Configuration for Auth ---
jwt.secret=${JWT_SECRET:mysteryGameSecretKeyForInvestigationAppRequires256BitsMinimum123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS Configuration ---
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
